version: 3

vars:
  VERSION: 0.2.5
  CLI_DIR: packages/cli
  VSCODE_DIR: packages/vscode

tasks:
  status:
    desc: Show version and status
    cmds:
      - 'grep "^version" {{.CLI_DIR}}/Cargo.toml'
      - 'git status --short'

  login-npm:
    desc: Login to npm from .env
    cmds:
      - cmd: 'node -e "const os=require(\"os\");const fs=require(\"fs\");const lines=fs.readFileSync(\".env\",\"utf8\").split(/\\r?\\n/);const line=lines.find(l=>l.startsWith(\"NPM_TOKEN=\"));if(line){const t=line.split(\"=\")[1];fs.writeFileSync(os.homedir()+\"/.npmrc\",\"//registry.npmjs.org/:_authToken=\"+t)}"'
      - cmd: 'npm whoami'

  login-cargo:
    desc: Login to cargo from .env
    cmds:
      - cmd: 'node -e "const os=require(\"os\");const fs=require(\"fs\");const lines=fs.readFileSync(\".env\",\"utf8\").split(/\\r?\\n/);const line=lines.find(l=>l.startsWith(\"CARGO_TOKEN=\"));if(line){const t=line.split(\"=\")[1];fs.writeFileSync(os.homedir()+\"/.cargo/credentials.toml\",\"[registry]\\ntoken = \\\"\"+t+\"\\\"\")}"'

  login:
    desc: Login to npm and cargo
    cmds:
      - task: login-npm
      - task: login-cargo

  bump:
    desc: Bump all versions (task bump -- 0.2.5)
    cmds:
      - cmd: 'node -e "const fs=require(\"fs\");const v=\"{{.CLI_ARGS}}\";const c=fs.readFileSync(\"{{.CLI_DIR}}/Cargo.toml\",\"utf8\").replace(/^version = .*/m,\"version = \\\"\"+v+\"\\\"\");fs.writeFileSync(\"{{.CLI_DIR}}/Cargo.toml\",c)"'
      - cmd: 'node -e "const fs=require(\"fs\");const v=\"{{.CLI_ARGS}}\";const p=JSON.parse(fs.readFileSync(\"{{.CLI_DIR}}/npm/package.json\"));p.version=v;fs.writeFileSync(\"{{.CLI_DIR}}/npm/package.json\",JSON.stringify(p,null,2))"'
      - cmd: 'node -e "const fs=require(\"fs\");const v=\"{{.CLI_ARGS}}\";const p=JSON.parse(fs.readFileSync(\"{{.VSCODE_DIR}}/package.json\"));p.version=v;fs.writeFileSync(\"{{.VSCODE_DIR}}/package.json\",JSON.stringify(p,null,2))"'
      - cmd: 'echo "Bumped to {{.CLI_ARGS}}"'

  tag:
    desc: Create git tag (task tag -- 0.2.5)
    cmds:
      - 'git add {{.CLI_DIR}}/Cargo.toml {{.CLI_DIR}}/npm/package.json {{.CLI_DIR}}/Cargo.lock {{.VSCODE_DIR}}/package.json'
      - 'git commit -m "chore: bump to {{.CLI_ARGS}}"'
      - 'git tag {{.CLI_ARGS}}'
      - 'git push origin dev'
      - 'git push origin {{.CLI_ARGS}}'

  publish-npm:
    desc: Publish CLI to npm
    dir: '{{.CLI_DIR}}/npm'
    cmds:
      - task: login-npm
      - 'cp ../../LICENSE .'
      - 'npm publish --access=public'

  publish-cargo:
    desc: Publish CLI to cargo
    dir: '{{.CLI_DIR}}'
    cmds:
      - task: login-cargo
      - 'cargo publish --registry crates-io'

  publish-vscode:
    desc: Publish VSCode extension
    dir: '{{.VSCODE_DIR}}'
    cmds:
      - 'npm run publish'

  publish:
    desc: Auto bump version and publish all
    cmds:
      - cmd: 'node -e "const fs=require(\"fs\");const c=fs.readFileSync(\"{{.CLI_DIR}}/Cargo.toml\",\"utf8\");const m=c.match(/^version = \"([^\"]+)\"/m);if(m){const p=m[1].split(\".\");p[2]=parseInt(p[2])+1;const nv=p.join(\".\");fs.writeFileSync(\"{{.CLI_DIR}}/Cargo.toml\",c.replace(/^version = .*/m,\"version = \\\"\"+nv+\"\\\"\"));const pkg=JSON.parse(fs.readFileSync(\"{{.CLI_DIR}}/npm/package.json\"));pkg.version=nv;fs.writeFileSync(\"{{.CLI_DIR}}/npm/package.json\",JSON.stringify(pkg,null,2));const vsc=JSON.parse(fs.readFileSync(\"{{.VSCODE_DIR}}/package.json\"));vsc.version=nv;fs.writeFileSync(\"{{.VSCODE_DIR}}/package.json\",JSON.stringify(vsc,null,2));console.log(\"New version: \"+nv)}"'
      - cmd: 'node -e "const fs=require(\"fs\");const execSync=require(\"child_process\").execSync;const c=fs.readFileSync(\"{{.CLI_DIR}}/Cargo.toml\",\"utf8\");const m=c.match(/^version = \"([^\"]+)\"/m);if(m){const v=m[1];execSync(\"cd {{.CLI_DIR}} && cargo update -w\");execSync(\"git add {{.CLI_DIR}}/Cargo.toml {{.CLI_DIR}}/npm/package.json {{.CLI_DIR}}/Cargo.lock {{.VSCODE_DIR}}/package.json\");execSync(\"git commit -m \\\"chore: bump to \"+v+\"\\\"\");execSync(\"git tag \"+v);execSync(\"git push origin dev\");execSync(\"git push origin \"+v)}"'
      - task: login
      - task: publish-npm
      - task: publish-cargo

  release:
    desc: Full release workflow (task release -- 0.2.5)
    cmds:
      - task: login
      - task: bump
        vars: {CLI_ARGS: '{{.CLI_ARGS}}'}
      - task: tag
        vars: {CLI_ARGS: '{{.CLI_ARGS}}'}
      - 'sleep 30'
      - task: publish-npm
      - task: publish-cargo

  build:
    desc: Build CLI release
    dir: '{{.CLI_DIR}}'
    cmds:
      - 'cargo build --release'

  build-vscode:
    desc: Build VSCode extension
    dir: '{{.VSCODE_DIR}}'
    cmds:
      - 'npm install'
      - 'npm run compile'

  test:
    desc: Run CLI tests
    dir: '{{.CLI_DIR}}'
    cmds:
      - 'cargo test'

  test-vscode:
    desc: Run VSCode lint
    dir: '{{.VSCODE_DIR}}'
    cmds:
      - 'npm run lint'

  clean:
    desc: Clean build artifacts
    cmds:
      - 'rm -rf {{.CLI_DIR}}/target'
      - 'rm -rf {{.VSCODE_DIR}}/dist'
      - 'rm -rf {{.VSCODE_DIR}}/node_modules'

  default:
    desc: List tasks
    cmds:
      - 'task --list'