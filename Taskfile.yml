version: 3

vars:
  VERSION: 0.2.1

tasks:
  status:
    desc: Show current version and status
    cmds:
      - 'grep "^version" Cargo.toml'
      - 'git status --short'

  bump:
    desc: Bump version (task bump -- v0.2.2)
    cmds:
      - 'sed -i "s/^version = .*/version = \"{{.CLI_ARGS}}\"/" Cargo.toml'
      - 'sed -i "s/\"version\": .*/\"version\": \"{{.CLI_ARGS}}\"/" npm/package.json'
      - 'echo "Bumped to {{.CLI_ARGS}}"'

  tag:
    desc: Create git tag (task tag -- v0.2.2)
    cmds:
      - 'git add Cargo.toml npm/package.json'
      - 'git commit -m "chore: bump version to {{.CLI_ARGS}}" || true'
      - 'git tag {{.CLI_ARGS}}'
      - 'git push origin dev'
      - 'git push origin {{.CLI_ARGS}}'
      - 'echo "Tagged: {{.CLI_ARGS}}"'

  publish-npm:
    desc: Publish to npm
    dir: npm
    cmds:
      - 'cp ../LICENSE .'
      - 'npm publish --access=public'

  publish-cargo:
    desc: Publish to crates.io
    cmds:
      - 'cargo publish --registry crates-io'

  publish:
    desc: Publish to npm and cargo
    cmds:
      - task: publish-npm
      - task: publish-cargo

  release:
    desc: Full release workflow
    cmds:
      - task: bump
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"
      - task: tag
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"
      - 'sleep 30'
      - task: publish

  build:
    desc: Build release binary
    cmds:
      - 'cargo build --release'

  test:
    desc: Run tests
    cmds:
      - 'cargo test'

  check:
    desc: Check code
    cmds:
      - 'cargo check'

  install:
    desc: Install locally
    cmds:
      - 'cargo install --path .'

  default:
    desc: Show tasks
    cmds:
      - 'task --list'