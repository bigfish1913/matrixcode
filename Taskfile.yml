version: 3

vars:
  VERSION: 0.2.1

tasks:
  status:
    desc: Show version and status
    cmds:
      - 'grep "^version" Cargo.toml'
      - 'git status --short'

  login-npm:
    desc: Login to npm from .env
    cmds:
      - cmd: 'TOKEN=$(grep "^NPM_TOKEN=" .env | cut -d= -f2) && echo "//registry.npmjs.org/:_authToken=$TOKEN" > ~/.npmrc && npm whoami'

  login-cargo:
    desc: Login to cargo from .env
    cmds:
      - cmd: 'TOKEN=$(grep "^CARGO_TOKEN=" .env | cut -d= -f2) && cargo login --registry crates-io "$TOKEN"'

  login:
    desc: Login to npm and cargo
    cmds:
      - task: login-npm
      - task: login-cargo

  bump-version:
    desc: Bump Cargo.toml version
    cmds:
      - cmd: 'sed -i "s/^version = .*/version = \"{{.CLI_ARGS}}\"/" Cargo.toml'

  bump-package:
    desc: Bump npm package.json version
    dir: npm
    cmds:
      - cmd: 'npm version --no-git-tag-version {{.CLI_ARGS}}'

  bump:
    desc: Bump all versions
    cmds:
      - task: bump-version
        vars: {CLI_ARGS: '{{.CLI_ARGS}}'}
      - task: bump-package
        vars: {CLI_ARGS: '{{.CLI_ARGS}}'}

  tag:
    desc: Create git tag
    cmds:
      - 'git add Cargo.toml npm/package.json'
      - 'git commit -m "chore: bump to {{.CLI_ARGS}}" || true'
      - 'git tag {{.CLI_ARGS}}'
      - 'git push origin dev'
      - 'git push origin {{.CLI_ARGS}}'

  publish-npm:
    desc: Publish to npm
    dir: npm
    cmds:
      - task: login-npm
      - 'cp ../LICENSE .'
      - 'npm publish --access=public'

  publish-cargo:
    desc: Publish to cargo
    cmds:
      - task: login-cargo
      - 'cargo publish --registry crates-io'

  publish:
    desc: Publish npm and cargo
    cmds:
      - task: login
      - task: publish-npm
      - task: publish-cargo

  release:
    desc: Full release workflow
    cmds:
      - task: login
      - task: bump
        vars: {CLI_ARGS: '{{.CLI_ARGS}}'}
      - task: tag
        vars: {CLI_ARGS: '{{.CLI_ARGS}}'}
      - 'sleep 30'
      - task: publish-npm
      - task: publish-cargo

  build:
    desc: Build release
    cmds:
      - 'cargo build --release'

  test:
    desc: Run tests
    cmds:
      - 'cargo test'

  default:
    desc: List tasks
    cmds:
      - 'task --list'