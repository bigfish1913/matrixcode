[workspace]
members = ["packages/core", "packages/tui", "packages/cli"]
resolver = "2"

[workspace.package]
version = "0.4.35"
edition = "2024"
authors = ["bigfish1913"]
license = "MIT"
repository = "https://github.com/bigfish1913/matrixcode"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }
tokio-test = "0.4"
async-trait = "0.1"
futures-util = "0.3"

# HTTP client
reqwest = { version = "0.13", features = ["json", "stream", "rustls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
indicatif = "0.17"
rustyline = "14"
termimad = "0.34"
is-terminal = "0.4"

# Error handling
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Utils
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tempfile = "3"
glob = "0.3"
regex = "1"
urlencoding = "2"
once_cell = "1"
parking_lot = "0.12"
shell-words = "1"

# TUI dependencies
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
pulldown-cmark = "0.13"
syntect = "5.3"
unicode-width = "0.2"
arboard = "3"

# Testing
mockito = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "8.0"
# Token counting
tiktoken-rs = "0.5"

# Internal crates
matrixcode-core = { path = "packages/core", version = "0.4.3" }
matrixcode-tui = { path = "packages/tui", version = "0.4.3" }