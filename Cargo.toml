[package]
name = "matrixcode"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full", "signal"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3"
glob = "0.3"
regex = "1"
indicatif = "0.17"
rustyline = "14"
termimad = "0.34"
is-terminal = "0.4"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"

[dev-dependencies]
mockito = "1"
tempfile = "3"
tokio-test = "0.4"
