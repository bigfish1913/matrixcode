[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["bigfish1913"]
license = "MIT"
repository = "https://github.com/bigfish1913/matrixcode"

[workspace.dependencies]
tokio = { version = "1", features = ["full", "signal"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3"
glob = "0.3"
regex = "1"
indicatif = "0.17"
rustyline = "14"
termimad = "0.34"
is-terminal = "0.4"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"

# Workspace 内部依赖
matrixcode-core = { path = "crates/matrixcode-core" }
matrixcode-tui = { path = "crates/matrixcode-tui" }