[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.3.3"
edition = "2024"
authors = ["bigfish1913"]
license = "MIT"
repository = "https://github.com/bigfish1913/matrixcode"

[workspace.dependencies]
tokio = { version = "1", features = ["full", "signal"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3"
glob = "0.3"
regex = "1"
indicatif = "0.17"
rustyline = "14"
termimad = "0.34"
is-terminal = "0.4"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tempfile = "3"
mockito = "1"
tokio-test = "0.4"
base64 = "0.22"
sha2 = "0.10"
tokio-rustls = "0.26"
rustls-pemfile = "2"
hyper = "1"
hyper-util = "0.1"
http-body-util = "0.1"
tower = "0.5"
tower-http = "0.6"
pin-project-lite = "0.2"
crossterm = "0.28"
bytes = "1"
arboard = "3"
mime = "0.3"
mime_guess = "2"
percent-encoding = "2"
url = "2"
once_cell = "1"
parking_lot = "0.12"

# Workspace crates
matrixcode-core = { path = "crates/matrixcode-core" }
matrixcode-tui = { path = "crates/matrixcode-tui" }

# TUI dependencies
ratatui = "0.29"
