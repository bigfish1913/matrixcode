# MCP Configuration Example
#
# Copy this file to .matrix/mcp.toml or ~/.matrix/mcp.toml

# Playwright MCP - Browser automation tools
[servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
enabled = true

