# Project-level Cargo config
# This overrides global config to fix WSL compatibility

[build]
# Use relative target directory for cross-platform compatibility
target-dir = "target"

[source.crates-io]
replace-with = "ustc"

[source.ustc]
registry = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"

[net]
git-fetch-with-cli = true