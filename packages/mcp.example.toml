# ============================================================================
# Settings
# ============================================================================

[settings]
# Auto discover MCP servers (default: true)
auto_discover = true

# Connection timeout in milliseconds (default: 30000)
connect_timeout_ms = 30000

# ============================================================================
# Usage Examples
# ============================================================================

# Example 1: Start TUI with Playwright
#   matrixcode-tui
#   
#   Then in chat:
#   User: 使用 Playwright 打开百度
#   Agent: [调用 browser_navigate 打开 https://www.baidu.com]

# Example 2: CLI with multiple servers
#   matrixcode-tui \
#     --mcp "playwright:npx -y @playwright/mcp@latest" \
#     --mcp "filesystem:npx -y @modelcontextprotocol/server-filesystem /home/user/project"

# Example 3: View MCP status in TUI
#   User: /mcp
#   System: 📋 MCP Servers:
#     • playwright ✓ 运行中 (23 工具)
#     • filesystem ✓ 运行中 (15 工具)

# ============================================================================
# Notes
# ============================================================================

# 1. Most MCP servers require Node.js and npx
# 2. First run will download the MCP server package
# 3. enabled = false means the server won't start automatically
# 4. You can enable servers at runtime using Agent API
# 5. For security, filesystem MCP only accesses specified directories
# 6. API keys and tokens should be set via environment variables

# ============================================================================
# Official MCP Servers List
# ============================================================================

# https://github.com/modelcontextprotocol/servers
# 
# Available servers:
# - playwright: Browser automation
# - puppeteer: Browser automation
# - filesystem: File system access
# - memory: Key-value storage
# - github: GitHub API
# - gitlab: GitLab API
# - postgres: PostgreSQL database
# - sqlite: SQLite database
# - gdrive: Google Drive
# - s3: Amazon S3
# - slack: Slack integration
# - docker: Docker management
# - kubernetes: K8s management
# - brave-search: Web search
# - fetch: Web scraping
# - And more...