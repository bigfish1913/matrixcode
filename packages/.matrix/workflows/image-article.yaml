# Image Article Generation Workflow
# Generate an illustrated article from a single sentence

id: image-article
name: Image Article Generator
version: "1.0.0"
description: Generate an illustrated article from one sentence with research, image search, and final output

inputs:
  - name: topic
    type: string
    required: true
    description: 一句话主题，用于生成图文内容

outputs:
  - name: article
    value: "{{final_output}}"
  - name: images
    value: "{{image_urls}}"

variables:
  max_images: 3
  content_style: "informative"

nodes:
  - id: start
    type: start
    name: 开始

  - id: research
    type: task
    name: 查资料
    task: websearch
    params:
      query: "{{topic}}"
      max_results: 5
    on_failure:
      type: retry
      max_attempts: 2
      interval_ms: 2000
    timeout_ms: 30000

  - id: search_images
    type: task
    name: 搜图片
    task: image_search
    params:
      query: "{{topic}} 相关图片"
      max_results: "{{max_images}}"
    on_failure:
      type: ignore
    timeout_ms: 20000

  - id: generate_output
    type: task
    name: 最终输出
    task: content_generation
    params:
      topic: "{{topic}}"
      research_data: "{{research.result}}"  # websearch 返回纯文本，自动包装为 {result: "..."}
      image_urls: "{{search_images.urls}}"
      style: "{{content_style}}"
    timeout_ms: 45000

  - id: end
    type: end
    name: 结束

edges:
  - id: e1
    from: start
    to: research

  - id: e2
    from: research
    to: search_images

  - id: e3
    from: search_images
    to: generate_output

  - id: e4
    from: generate_output
    to: end